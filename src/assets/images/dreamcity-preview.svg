    <text x="16" y="28" fill="#94a3b8" fontSize="10" fontFamily="sans-serif" fontWeight="500">GEO PINNED SITES</text>
    <text x="16" y="58" fill="#10b981" fontSize="24" fontFamily="monospace" fontWeight="bold">98.6%</text>
    <text x="110" y="58" fill="#10b981" fontSize="11" fontFamily="sans-serif">Validated</text>
  </g>

