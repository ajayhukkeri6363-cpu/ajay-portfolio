<svg viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0f17" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
    <linearGradient id="mapGrid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#3b82f6" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#10b981" stopOpacity="0.15" />
    </linearGradient>
  </defs>

  {/* Background Frame */}
  <rect width="800" height="480" rx="16" fill="url(#dcBg)" />
  
  {/* Top App Header */}
  <rect width="800" height="48" fill="#111827" stroke="#1f2937" strokeWidth="1" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#eab308" />
  <circle cx="68" cy="24" r="6" fill="#22c55e" />
  <rect x="100" y="12" width="280" height="24" rx="6" fill="#1f2937" />
  <text x="112" y="28" fill="#9ca3af" fontSize="11" fontFamily="monospace">dreamcity.gov/dashboard/live-map</text>

  {/* Left Sidebar */}
  <rect x="0" y="48" width="180" height="432" fill="#0f172a" stroke="#1e293b" strokeWidth="1" />
  <text x="24" y="86" fill="#f59e0b" fontSize="14" fontFamily="sans-serif" fontWeight="bold">DreamCity</text>
  <text x="24" y="104" fill="#64748b" fontSize="10" fontFamily="sans-serif">Civic Analyzer v2.0</text>

  <rect x="16" y="130" width="148" height="32" rx="8" fill="#1e293b" />
  <text x="36" y="150" fill="#ffffff" fontSize="11" fontFamily="sans-serif" fontWeight="600">📊 Live Analytics</text>

  <rect x="16" y="172" width="148" height="32" rx="8" fill="transparent" />
  <text x="36" y="192" fill="#94a3b8" fontSize="11" fontFamily="sans-serif">🗺️ Map View</text>

  <rect x="16" y="214" width="148" height="32" rx="8" fill="transparent" />
  <text x="36" y="234" fill="#94a3b8" fontSize="11" fontFamily="sans-serif">📝 Issues Queue</text>

  <rect x="16" y="256" width="148" height="32" rx="8" fill="transparent" />
  <text x="36" y="276" fill="#94a3b8" fontSize="11" fontFamily="sans-serif">🏛️ Governance</text>

  {/* Main Dashboard Canvas */}
  {/* Stat Cards */}
  <g transform="translate(204, 68)">
    <rect width="180" height="80" rx="12" fill="#111827" stroke="#1f2937" strokeWidth="1" />
    <text x="16" y="28" fill="#94a3b8" fontSize="10" fontFamily="sans-serif" fontWeight="500">TOTAL COMPLAINTS</text>
    <text x="16" y="58" fill="#ffffff" fontSize="24" fontFamily="monospace" fontWeight="bold">1,482</text>
    <text x="96" y="58" fill="#10b981" fontSize="11" fontFamily="sans-serif">+14% resolved</text>
  </g>

  <g transform="translate(396, 68)">
    <rect width="180" height="80" rx="12" fill="#111827" stroke="#1f2937" strokeWidth="1" />
    <text x="16" y="28" fill="#94a3b8" fontSize="10" fontFamily="sans-serif" fontWeight="500">AVG RESOLUTION</text>
    <text x="16" y="58" fill="#f59e0b" fontSize="24" fontFamily="monospace" fontWeight="bold">18.4 hrs</text>
    <text x="120" y="58" fill="#3b82f6" fontSize="11" fontFamily="sans-serif">Fast lane</text>
  </g>

  <g transform="translate(588, 68)">
