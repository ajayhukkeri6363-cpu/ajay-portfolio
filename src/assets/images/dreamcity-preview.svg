    <rect width="360" height="290" rx="12" fill="#0f172a" stroke="#1e293b" strokeWidth="1" />
    
    {/* Map Grid and streets */}
    <path d="M20 60 Q 120 40, 240 120 T 340 180" stroke="rgba(245, 158, 11, 0.4)" strokeWidth="4" fill="none" />
    <path d="M60 270 Q 150 180, 260 210 T 320 260" stroke="rgba(59, 130, 246, 0.4)" strokeWidth="3" fill="none" />
    <line x1="180" y1="20" x2="180" y2="270" stroke="rgba(255,255,255,0.06)" strokeWidth="2" strokeDasharray="4 4" />
    <line x1="20" y1="150" x2="340" y2="150" stroke="rgba(255,255,255,0.06)" strokeWidth="2" strokeDasharray="4 4" />

    {/* Map Pins */}
    <circle cx="120" cy="80" r="12" fill="#ef4444" fillOpacity="0.2" />
    <circle cx="120" cy="80" r="6" fill="#ef4444" />
    
    <circle cx="240" cy="120" r="14" fill="#f59e0b" fillOpacity="0.2" />
    <circle cx="240" cy="120" r="7" fill="#f59e0b" />

    <circle cx="280" cy="220" r="12" fill="#10b981" fillOpacity="0.2" />
    <circle cx="280" cy="220" r="6" fill="#10b981" />

    {/* Map overlay card */}
    <rect x="20" y="210" width="160" height="60" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" strokeWidth="1" />
    <text x="32" y="232" fill="#ffffff" fontSize="11" fontFamily="sans-serif" fontWeight="bold">Civic Pin #4029</text>
    <text x="32" y="248" fill="#f59e0b" fontSize="10" fontFamily="sans-serif">Roadway Pothole • Verified</text>
    <text x="32" y="260" fill="#94a3b8" fontSize="9" fontFamily="monospace">12.9716° N, 77.5946° E</text>
  </g>

  {/* Realtime Stream List */}
  <g transform="translate(576, 164)">
    <rect width="200" height="290" rx="12" fill="#111827" stroke="#1f2937" strokeWidth="1" />
    <text x="16" y="28" fill="#f3f4f6" fontSize="12" fontFamily="sans-serif" fontWeight="bold">Recent Submissions</text>

    {/* Item 1 */}
    <rect x="12" y="44" width="176" height="68" rx="8" fill="#1e293b" />
    <text x="24" y="66" fill="#f59e0b" fontSize="11" fontFamily="sans-serif" fontWeight="600">Streetlight Outage</text>
    <text x="24" y="82" fill="#94a3b8" fontSize="9" fontFamily="sans-serif">Ward 14 • In Progress</text>
    <text x="24" y="98" fill="#10b981" fontSize="9" fontFamily="monospace">STATUS: DISPATCHED</text>

    {/* Item 2 */}
    <rect x="12" y="122" width="176" height="68" rx="8" fill="#1e293b" />
    <text x="24" y="144" fill="#f59e0b" fontSize="11" fontFamily="sans-serif" fontWeight="600">Water Pipeline Leak</text>
    <text x="24" y="160" fill="#94a3b8" fontSize="9" fontFamily="sans-serif">Sector 7 • Under Review</text>
    <text x="24" y="176" fill="#3b82f6" fontSize="9" fontFamily="monospace">STATUS: ANALYZED</text>

    {/* Item 3 */}
    <rect x="12" y="200" width="176" height="68" rx="8" fill="#1e293b" />
    <text x="24" y="222" fill="#f59e0b" fontSize="11" fontFamily="sans-serif" fontWeight="600">Waste Management</text>
    <text x="24" y="238" fill="#94a3b8" fontSize="9" fontFamily="sans-serif">Central Block • Verified</text>
    <text x="24" y="254" fill="#10b981" fontSize="9" fontFamily="monospace">STATUS: RESOLVED</text>
  </g>
</svg>
